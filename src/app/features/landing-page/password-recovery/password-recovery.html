<div>
  <div class="headline">
    <button class="back-btn" type="button" (click)="goToLogin()">
      <svg
        class="back-arrow"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M6.875 14.8885L0.275 8.28846C0.175 8.18846 0.104 8.08013 0.0619998 7.96346C0.0206665 7.84679 0 7.72179 0 7.58846C0 7.45513 0.0206665 7.33013 0.0619998 7.21346C0.104 7.09679 0.175 6.98846 0.275 6.88846L6.875 0.288461C7.05833 0.105128 7.28733 0.00912821 7.562 0.00046154C7.83733 -0.00753846 8.075 0.0884612 8.275 0.288461C8.475 0.471795 8.57933 0.700795 8.588 0.975461C8.596 1.25079 8.5 1.48846 8.3 1.68846L3.4 6.58846H14.575C14.8583 6.58846 15.096 6.68413 15.288 6.87546C15.4793 7.06746 15.575 7.30513 15.575 7.58846C15.575 7.87179 15.4793 8.10913 15.288 8.30046C15.096 8.49246 14.8583 8.58846 14.575 8.58846H3.4L8.3 13.4885C8.48333 13.6718 8.57933 13.9051 8.588 14.1885C8.596 14.4718 8.5 14.7051 8.3 14.8885C8.11667 15.0885 7.88333 15.1885 7.6 15.1885C7.31667 15.1885 7.075 15.0885 6.875 14.8885Z"
          fill="currentColor"
        />
      </svg>
    </button>
    <h2>Reset password</h2>
  </div>

  <p>Please enter your email address.</p>

  <div class="inputs">
    <div class="input-wrapper">
      <svg
        class="input-icon"
        width="20"
        height="16"
        viewBox="0 0 20 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M2 16C1.45 16 0.979333 15.8043 0.588 15.413C0.196 15.021 0 14.55 0 14V2C0 1.45 0.196 0.979333 0.588 0.588C0.979333 0.196 1.45 0 2 0H18C18.55 0 19.021 0.196 19.413 0.588C19.8043 0.979333 20 1.45 20 2V14C20 14.55 19.8043 15.021 19.413 15.413C19.021 15.8043 18.55 16 18 16H2ZM18 4L10.525 8.675C10.4417 8.725 10.354 8.76233 10.262 8.787C10.1707 8.81233 10.0833 8.825 10 8.825C9.91667 8.825 9.82933 8.81233 9.738 8.787C9.646 8.76233 9.55833 8.725 9.475 8.675L2 4V14H18V4ZM10 7L18 2H2L10 7ZM2 4.25V2.775V2.8V2.787V4.25Z"
          fill="#686868"
        />
      </svg>

      <input type="text" placeholder="examplename@email.com" [formField]="recoveryForm.email" />
      @if (recoveryForm.email().invalid() && recoveryForm.email().touched()) {
        <span class="error-msg">{{ recoveryForm.email().errors()[0].message }}</span>
      }
    </div>
  </div>

  <p>We'll send you an email that lets you change your password.</p>

  <button
    class="main"
    type="button"
    (click)="onSubmit()"
    [disabled]="recoveryForm().invalid() || isSubmitting()"
  >
    {{ isSubmitting() ? 'Sending…' : 'Send email' }}
  </button>

  @if (errorMessage()) {
    <span class="error-msg-form">{{ errorMessage() }}</span>
  }
</div>

@if (wasSent()) {
  <app-toast message="Email sent">
    <svg width="37" height="32" viewBox="0 0 37 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M2.91667 31.1086C2.22222 31.3864 1.5625 31.3253 0.9375 30.9253C0.3125 30.5267 0 29.9454 0 29.1815V21.4211C0 20.935 0.138889 20.501 0.416667 20.119C0.694444 19.7371 1.07639 19.494 1.5625 19.3899L16.6667 15.6399L1.5625 11.8899C1.07639 11.7857 0.694444 11.5426 0.416667 11.1607C0.138889 10.7788 0 10.3447 0 9.85862V2.0982C0 1.33431 0.3125 0.752366 0.9375 0.352366C1.5625 -0.0462449 2.22222 -0.106662 2.91667 0.171115L35 13.7128C35.868 14.0947 36.3021 14.7371 36.3021 15.6399C36.3021 16.5426 35.868 17.185 35 17.5669L2.91667 31.1086Z"
        fill="white"
      />
    </svg>
  </app-toast>
}
