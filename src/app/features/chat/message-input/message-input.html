<div class="message-input">
  <textarea
    class="message-input__field"
    [placeholder]="placeholder"
    [(ngModel)]="text"
    (keydown.enter)="onEnter($event)"
  ></textarea>

  <div class="message-input__actions">
    <button class="message-input__icon-btn" (click)="toggleEmojiPicker()">
      <img src="/icons/emoji.svg" alt="Emoji" />
    </button>
    <button class="message-input__icon-btn" (click)="insertMention()">
      <img src="/icons/at.svg" alt="Erwähnen" />
    </button>

    <button
      class="message-input__send-btn"
      [disabled]="!text.trim()"
      (click)="send()"
    >
      <img src="/icons/send.svg" alt="Senden" />
    </button>
  </div>
</div>
