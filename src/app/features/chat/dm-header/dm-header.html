<div class="channel-header">
    <div class="channel-header__title" (click)="openUserCard()">
        <div class="sidebar__avatar-wrapper">
            <img [src]="currentDmPartner()?.avatar || 'app-icons/avatar-placeholder.svg'" alt=""
                class="sidebar__avatar" />
            <span class="sidebar__status"
                [class.sidebar__status--online]="currentDmPartner()?.status === 'online'"></span>
        </div>
        <span class="channel-header__name">
            {{ currentDmPartner()?.name }}
            @if (isSelf()) {
            <span>(You)</span>
            }
        </span>
    </div>
</div>


<dialog #profileCard autofocus class="header__profile header__profile--dialog" (click)="onBackdropClick($event)">
    <div class="header__profile-card" tabindex="-1" autofocus (click)="$event.stopPropagation()">
        <div class="header__profile-header">
            <p class="header__profile-heading">Profile</p>
            <button (click)="closeUserCard()" class="header__profile-button header__profile-button--close"><img
                    src="app-icons/close.svg"></button>
        </div>
        <img [src]="currentDmPartner()?.avatar || 'app-icons/avatar-placeholder.svg'" alt=""
            class="header__profile-avatar" />
        <div class="header__profile-info-wrapper">
            <div class="header__profile-name-wrapper">
                <p>{{currentDmPartner()?.name}}</p>
            </div>
            <div class="header__profile-status-wrapper">
                <div class="header__profile-status-dot"></div>
                <p>Status placeholder</p>
            </div>
        </div>
        <div class="header__profile-mail-wrapper">
            <div class="header__profile-mail-header">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <mask id="mask0_163_231" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="30"
                        height="30">
                        <rect width="30" height="30" fill="#D9D9D9" />
                    </mask>
                    <g mask="url(#mask0_163_231)">
                        <path
                            d="M5 25C4.3125 25 3.72417 24.7554 3.235 24.2663C2.745 23.7763 2.5 23.1875 2.5 22.5V7.5C2.5 6.8125 2.745 6.22417 3.235 5.735C3.72417 5.245 4.3125 5 5 5H25C25.6875 5 26.2763 5.245 26.7663 5.735C27.2554 6.22417 27.5 6.8125 27.5 7.5V22.5C27.5 23.1875 27.2554 23.7763 26.7663 24.2663C26.2763 24.7554 25.6875 25 25 25H5ZM25 10L15.6562 15.8438C15.5521 15.9062 15.4425 15.9529 15.3275 15.9837C15.2133 16.0154 15.1042 16.0312 15 16.0312C14.8958 16.0312 14.7867 16.0154 14.6725 15.9837C14.5575 15.9529 14.4479 15.9062 14.3438 15.8438L5 10V22.5H25V10ZM15 13.75L25 7.5H5L15 13.75ZM5 10.3125V8.46875V8.5V8.48375V10.3125Z"
                            fill="black" />
                    </g>
                </svg>
                <p class="header__profile-mail-heading">E-Mail Address</p>
            </div>
            <a href="mailto:{{currentDmPartner()?.email}}"
                class="header__profile-mail">{{currentDmPartner()?.email}}</a>
        </div>

        <button (click)="closeUserCard()" class="button button--submit header__profile-button--message">
            <svg width="20" height="19" viewBox="0 0 20 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M18.3 18.3L16 16H2C1.45 16 0.979333 15.8043 0.588 15.413C0.196 15.021 0 14.55 0 14V2C0 1.45 0.196 0.979 0.588 0.587C0.979333 0.195667 1.45 0 2 0H18C18.55 0 19.021 0.195667 19.413 0.587C19.8043 0.979 20 1.45 20 2V17.575C20 18.025 19.796 18.3373 19.388 18.512C18.9793 18.6873 18.6167 18.6167 18.3 18.3ZM2 2V14H16.825L18 15.175V2H2Z"
                    fill="white" />
            </svg>
            <p>Message</p>
        </button>
    </div>
</dialog>
