<div class="channel-header">
  <div class="channel-header__title" (click)="userCard.openUserCard()">
    <div class="sidebar__avatar-wrapper">
      <img
        [src]="currentDmPartner()?.avatar || 'app-icons/avatar-placeholder.svg'"
        alt=""
        class="sidebar__avatar"
      />
      <span
        class="sidebar__status"
        [class.sidebar__status--online]="
          presenceService.isOnline(
            currentDmPartner()?.uid,
            currentDmPartner()?.isDemoUser ? currentDmPartner()?.status : undefined
          )
        "
      ></span>
    </div>
    <span class="channel-header__name">
      {{ currentDmPartner()?.name }}
      @if (isSelf()) {
        <span>(You)</span>
      }
    </span>
  </div>
</div>

<app-usercard-dialog #userCard [user]="currentDmPartner()"></app-usercard-dialog>
