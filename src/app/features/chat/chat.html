<section class="chat">
  <app-channel-header
    [channel]="activeChannel"
    (memberIconClicked)="openMemberList()"
  ></app-channel-header>

  <app-message-list
    [messages]="messages"
    (threadOpened)="openThread($event)"
  ></app-message-list>

  <app-message-input
    [placeholder]="'Message to #' + (activeChannel?.name ?? '')"
    /* (messageSent)="sendMessage($event)" */
        /* (messageSent)="this.channelService.addMessageToChannel($event)" */

  ></app-message-input>
</section>
