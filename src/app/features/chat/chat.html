<section class="chat">
  <app-channel-header
    [channel]="activeChannel"
    (memberIconClicked)="openMemberList()"
  ></app-channel-header>

  <app-message-list
    [messages]="displayedMessages"
    [dmId]="activeDmId"
    [channelId]="activeChannel?.id ?? null"
    [currentUserId]="effectiveUserId"
    (threadOpened)="openThread($event)"
  ></app-message-list>

  <app-message-input
    [placeholder]="activeChannel ? 'Message to #' + activeChannel.name : 'Message to ' + activeDmName"
    [dmId]="activeDmId"
    [senderId]="effectiveUserId"
    (messageSent)="sendMessage($event)"
  ></app-message-input>
</section>
