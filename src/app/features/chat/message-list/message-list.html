<div class="message-list">
  <ng-container *ngFor="let group of groupedMessages">
    <div class="message-list__divider">
      <span>{{ group.dateLabel }}</span>
    </div>

    <div
      *ngFor="let message of group.messages"
      class="message-list__item"
      [class.message-list__item--own]="message.senderId === currentUserId"
    >
      <img class="message-list__avatar" src="app-icons/avatar-placeholder.svg" alt="">

      <div class="message-list__content">
        <div class="message-list__meta">
          <span class="message-list__author">{{ message.senderId }}</span>
          <span class="message-list__time">{{ message.createdAt?.toDate() | date: 'shortTime' }}</span>
        </div>

        <div class="message-list__bubble">{{ message.text }}</div>

        <app-reaction-bar
          [reactions]="messageReactions(message)"
          (reactionToggled)="onReactionToggled(message, $event)"
        ></app-reaction-bar>

        <button
          *ngIf="message.threadCount"
          class="message-list__thread-link"
          (click)="threadOpened.emit(message)"
        >
          {{ message.threadCount }} replies
        </button>
      </div>
    </div>
  </ng-container>
</div>
