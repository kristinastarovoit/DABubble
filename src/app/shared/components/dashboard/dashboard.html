<app-header />

<div class="app-wrapper" [class.app-wrapper--chat-open]="mobileChatOpen()">
  <app-sidebar
    (sidebarToggled)="onSidebarToggled($event)"
    (conversationOpened)="mobileChatOpen.set(true)"
  />
  <div class="app-wrapper__main" [class.app-wrapper__main--full-width]="!isSidebarOpen">
    <button type="button" class="app-wrapper__back" (click)="mobileChatOpen.set(false)">
      &#8592; Devspace
    </button>
    <app-chat />
  </div>
  <app-thread />
</div>
