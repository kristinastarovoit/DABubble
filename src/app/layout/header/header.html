<header class="header" [class.header--chat]="chatMode()">
  <div class="wrapper">
    <button type="button" class="header__chat-nav" (click)="back.emit()">
      <img src="app-icons/arrow_down.svg" alt="Back" class="header__chat-nav-arrow" />
      <img src="app-icons/workspace.svg" alt="" class="header__chat-nav-icon" />
      <span class="header__chat-nav-text">Devspace</span>
    </button>

    <div class="header__logo">
      <img src="app-icons/logo.svg" alt="DABubble Logo" class="header__logo-icon" />
      <span class="header__logo-text">DABubble</span>
    </div>

    <div class="header__search">
      <input type="text" class="header__search-input" placeholder="Search Devspace" [(ngModel)]="searchQuery"
        (input)="onSearchInput()" />
      <img src="app-icons/search.svg" alt="Search Icon" class="header__search-icon" />
    </div>
  </div>

  @if (isUserMenuOpen) {
  <div class="header__backdrop" (click)="closeUserMenu()"></div>
  }

  @if (isUserProfileOpen) {
  <div class="header__backdrop" (click)="closeUserProfile()"></div>
  }

  <div class="header__user" [class.header__user--menu-open]="isUserMenuOpen" (click)="toggleUserMenu()">
    <span class="header__user-name">{{ currentUser()?.name }}</span>

    <img [src]="currentUser()?.avatar || 'app-icons/avatar-placeholder.svg'" alt="" class="header__user-avatar" />
    <img src="app-icons/arrow_down.svg" alt="" class="header__user-chevron header__user-chevron--default" />
    <img src="app-icons/arrow_down_purple.svg" alt="" class="header__user-chevron header__user-chevron--hover" />

    @if (isUserMenuOpen) {
    <div class="header__user-menu">
      <button (click)="openUserProfile()">Profile</button>
      <button (click)="logout()">Logout</button>
    </div>
    }
    @if(isUserProfileOpen){
    <div class="header__profile">
      <div class="header__profile-header">
        <p class="header__profile-heading">Profile</p>
        <button (click)="closeUserProfile()" class="header__profile-button"><img src="app-icons/close.svg"></button>
      </div>
      <img [src]="currentUser()?.avatar || 'app-icons/avatar-placeholder.svg'" alt="" class="header__profile-avatar" />
      <div class="header__profile-info-wrapper">
        <div class="header__profile-name-wrapper">
          <p>{{currentUser()?.name}}</p>
          <button class="header__profile-button">Edit</button>
        </div>
        <div class="header__profile-status-wrapper">
          <div class="header__profile-status-dot"></div>
          <p>Status placeholder</p>
        </div>
      </div>
      <div class="header__profile-mail-wrapper">
        <div class="header__profile-mail-header">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <mask id="mask0_163_231" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="30"
              height="30">
              <rect width="30" height="30" fill="#D9D9D9" />
            </mask>
            <g mask="url(#mask0_163_231)">
              <path
                d="M5 25C4.3125 25 3.72417 24.7554 3.235 24.2663C2.745 23.7763 2.5 23.1875 2.5 22.5V7.5C2.5 6.8125 2.745 6.22417 3.235 5.735C3.72417 5.245 4.3125 5 5 5H25C25.6875 5 26.2763 5.245 26.7663 5.735C27.2554 6.22417 27.5 6.8125 27.5 7.5V22.5C27.5 23.1875 27.2554 23.7763 26.7663 24.2663C26.2763 24.7554 25.6875 25 25 25H5ZM25 10L15.6562 15.8438C15.5521 15.9062 15.4425 15.9529 15.3275 15.9837C15.2133 16.0154 15.1042 16.0312 15 16.0312C14.8958 16.0312 14.7867 16.0154 14.6725 15.9837C14.5575 15.9529 14.4479 15.9062 14.3438 15.8438L5 10V22.5H25V10ZM15 13.75L25 7.5H5L15 13.75ZM5 10.3125V8.46875V8.5V8.48375V10.3125Z"
                fill="black" />
            </g>
          </svg>
          <p class="header__profile-mail-heading">E-Mail Address</p>
        </div>
        <p class="header__profile-mail">{{currentUser()?.email}}</p>
      </div>
    </div>
    }
  </div>
</header>
