<dialog #dialogRef class="channel-create" (click)="onBackdropClick($event)">
  <div class="channel-create__card">
    <div class="channel-create__header">
      <h2 class="channel-create__title">Channel erstellen</h2>
      <button class="channel-create__close-btn" (click)="cancel()">
        <img src="app-icons/close.svg" alt="Schließen" />
      </button>
    </div>

    <p class="channel-create__description">
      Channels dienen deinem Team zur Kommunikation. Am besten sollten sie
      themenbezogen sein – #marketing zum Beispiel.
    </p>

    <form class="channel-create__form" (ngSubmit)="submit()">
      <div class="channel-create__field">
        <label class="channel-create__label" for="channel-name">Channel-Name</label>
        <div class="channel-create__input-wrapper">
          <span class="channel-create__prefix">#</span>
          <input
            id="channel-name"
            type="text"
            class="channel-create__input"
            placeholder="z.B. Kooperationsprojekte"
            [(ngModel)]="name"
            name="name"
            maxlength="50"
          />
        </div>
        <span class="channel-create__error" *ngIf="errorMessage">{{ errorMessage }}</span>
      </div>

      <div class="channel-create__field">
        <label class="channel-create__label" for="channel-description">
          Beschreibung <span class="channel-create__label-optional">(optional)</span>
        </label>
        <div class="channel-create__input-wrapper">
          <input
            id="channel-description"
            type="text"
            class="channel-create__input"
            placeholder="Dein Text hier"
            [(ngModel)]="description"
            name="description"
            maxlength="200"
          />
        </div>
      </div>

      <div class="channel-create__actions">
        <button
          type="submit"
          class="channel-create__submit-btn"
          [disabled]="!name.trim()"
        >
          Erstellen
        </button>
      </div>
    </form>
  </div>
</dialog>
