<aside class="sidebar">
  <div class="sidebar__header">
    <div class="sidebar__title">
      <img src="app-icons/workspace.svg" alt="Workspace Logo" class="sidebar__title-icon" />
      <span class="sidebar__title-text">Devspace</span>
    </div>
    <button class="sidebar__edit-btn" (click)="openWorkspaceEdit()">
      <img src="app-icons/edit.svg" alt="Edit" />
    </button>
  </div>

  <!-- Channels -->
  <div class="sidebar__section">
    <div class="sidebar__section-header" (click)="toggleChannels()">
      <img
        src="/icons/chevron-down.svg"
        alt=""
        class="sidebar__chevron"
        [class.sidebar__chevron--collapsed]="!isChannelsOpen"
      />
      <img src="app-icons/channels.svg" alt="Channels Icon" class="sidebar__section-icon" />
      <span class="sidebar__section-title">Channels</span>
    </div>

    <ul class="sidebar__list" *ngIf="isChannelsOpen">
      <li
        /* *ngFor="let channel of channels"
        class="sidebar__item"
        [class.sidebar__item--active]="channel.id === activeChannelId"
        (click)="selectChannel(channel)" */
      >
        <span class="sidebar__item-icon">#</span>
        <!-- <span class="sidebar__item-name">{{ channel.name }}</span> -->
         <span class="sidebar__item-name">Channel-Platzhalter</span>
      </li>

      <li class="sidebar__item sidebar__item--add" (click)="openChannelCreate()">
        <img src="app-icons/add.svg" alt="Add Icon" class="sidebar__item-icon" />
        <span class="sidebar__item-name">Channel hinzufügen</span>
      </li>
    </ul>
  </div>

  <!-- Direktnachrichten -->
  <div class="sidebar__section">
    <div class="sidebar__section-header" (click)="toggleDirectMessages()">
      <img
        src="app-icons/arrow-down.svg"
        alt=""
        class="sidebar__chevron"
        [class.sidebar__chevron--collapsed]="!isDirectMessagesOpen"
      />
      <img src="app-icons/account.svg" alt="Account Icon" class="sidebar__section-icon" />
      <span class="sidebar__section-title">Direktnachrichten</span>
    </div>

    <ul class="sidebar__list" *ngIf="isDirectMessagesOpen">
      <li
        /* *ngFor="let contact of directMessages"
        class="sidebar__item"
        [class.sidebar__item--active]="contact.id === activeDmId"
        (click)="selectDirectMessage(contact)" */
      >
        <div class="sidebar__avatar-wrapper">
          <!-- <img [src]="contact.avatarUrl" alt="" class="sidebar__avatar" /> -->
           <img src="app-icons/avatar-placeholder.svg" alt="" class="sidebar__avatar" />
          <span
            class="sidebar__status"
            /* [class.sidebar__status--online]="contact.isOnline" */
          ></span>
        </div>
        <span class="sidebar__item-name">
          <!-- {{ contact.name }} -->
            Name-Platzhalter
          <!-- <span *ngIf="contact.isCurrentUser">(Du)</span> -->
        </span>
      </li>
    </ul>
  </div>
</aside>
